name: Aam Salah eval
# Spec §8.6: nightly from the default branch, on every push that changes the
# assistant's instructions or the eval, and by hand.
on:
  schedule:
    - cron: '0 2 * * *' # every night, 02:00 UTC
  push:
    branches: [main]
    paths: ['lib/aam-salah/**', 'scripts/eval-aam-salah.js']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Key present
        run: test -n "$GEMINI_API_KEY" || { echo "::error::The GEMINI_API_KEY secret is not set"; exit 1; }
      - name: ≥ 22/24 (rate 0.9167) on the production model
        run: npm run eval -- --models gemini:gemini-3.5-flash-lite --min-rate 0.9167
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: .eval/ }
