name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Types, lint, format, unit + db + component tests (coverage ≥ 90 % on src/shared)
        run: npm run check
      - run: npm run build
      - name: First-load JS ≤ 150 kB gzipped (spec §8.4)
        run: npm run check:size
      - name: notify-run bundle builds, under its 200 kB cap
        run: npm run build:notify
      - name: Runtime dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  # Runs against the Supabase test project, so it needs the repository secrets
  # below. Start it by hand from the Actions tab.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_PARTNER_EMAIL: ${{ secrets.TEST_PARTNER_EMAIL }}
      TEST_PARTNER_PASSWORD: ${{ secrets.TEST_PARTNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: E2E + axe on iPhone 13 and Pixel 7 (on a local Cloudflare Pages server)
        env: { WRANGLER_SEND_METRICS: 'false' }
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }
